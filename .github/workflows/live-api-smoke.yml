name: Live API smoke

# Unofficial PSN / Nintendo endpoints can change without notice.
# This job hits the real services with personal credentials once a week
# so a breaking change shows up as a red run instead of an empty library in the app.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live API (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [steam, playstation, nintendo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # A test whose secrets are missing is skipped (JUnit Assume), not failed.
      - run: ./gradlew :platform:${{ matrix.platform }}:liveTest
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          NSO_SESSION_TOKEN: ${{ secrets.NSO_SESSION_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ matrix.platform }}-reports
          path: platform/${{ matrix.platform }}/build/reports/tests/
          if-no-files-found: ignore
